services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Bangkok
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP
          --connect-timeout=3 -h 127.0.0.1 -u "$${MYSQL_USER}"
          "$${MYSQL_DATABASE}" -Nse 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - stack

  api:
    build: ./01_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001

      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

      TZ: Asia/Bangkok
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      mysql:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/health', {signal: AbortSignal.timeout(4000)})
          .then(async r => {const b = await r.json(); if (!r.ok || b.status !== 'ok' || b.db !== true) throw new Error('API/database not ready');})
          .then(() => process.exit(0)).catch(e => {console.error(e.message); process.exit(1);})
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - stack

  frontend:
    build: ./02_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST_INTERNAL: http://api:3001
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=1001,gid=1001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          Promise.all([
          fetch('http://127.0.0.1:3000/', {signal: AbortSignal.timeout(4000)}).then(async r => {if (!r.ok) throw new Error('Frontend not ready'); await r.text();}),
          fetch('http://127.0.0.1:3000/api/attractions', {signal: AbortSignal.timeout(4000)}).then(async r => {if (!r.ok || !Array.isArray(await r.json())) throw new Error('Frontend API proxy not ready');})
          ]).then(() => process.exit(0)).catch(e => {console.error(e.message); process.exit(1);})
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - stack

volumes:
  mysql_data:

networks:
  stack:
    driver: bridge
